<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Cleaner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-a" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-b" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="app-top">
        <p class="eyebrow">Text Cleaner</p>
        <h1>Text Cleaner</h1>
        <p class="subhead">Clean your text in seconds</p>
      </header>

      <section class="workspace" aria-label="Text cleaning workspace">
        <section class="panel input-panel" aria-label="Input text">
          <label for="inputText">Input</label>
          <textarea id="inputText" class="input-area" placeholder="Paste your text here..."></textarea>
          <div class="tool-row" aria-label="Input tools">
            <button id="pasteBtn" class="secondary-btn" type="button">Paste</button>
            <button id="clearInputBtn" class="secondary-btn" type="button" disabled>Clear Input</button>
          </div>
        </section>

        <section class="action-rail" aria-label="Text actions">
          <button id="cleanBtn" class="primary-btn primary-btn-large" type="button" disabled>Clean Text</button>
          <div class="tool-stack" aria-label="Secondary text actions">
            <button id="caseBtn" class="secondary-btn" type="button" disabled>Fix Case</button>
            <button id="symbolsBtn" class="secondary-btn" type="button" disabled>Remove Symbols</button>
            <button id="bulletsBtn" class="secondary-btn" type="button" disabled>Make Bullets</button>
          </div>
        </section>

        <section class="panel output-panel" aria-label="Output text">
          <label for="outputText">Output</label>
          <textarea id="outputText" class="output-area" readonly placeholder="Processed text appears here..."></textarea>
          <div class="tool-row" aria-label="Output tools">
            <button id="copyBtn" class="secondary-btn" type="button" disabled>Copy</button>
            <button id="downloadBtn" class="secondary-btn" type="button" disabled>Download</button>
            <button id="clearOutputBtn" class="secondary-btn" type="button" disabled>Clear</button>
          </div>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
